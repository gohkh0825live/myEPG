name: 'Update EPG schedule'

on:
  schedule:
    - cron: '0 4,16 * * *'  # 每日 04:00 和 16:00 UTC
  workflow_dispatch:
    branches:
      - master
  push:
    branches:
      - master

# 添加权限配置
permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 保持你的超时设置

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          # 添加 token 以支持推送
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pipenv'

      - name: Install pipenv
        run: pip3 install pipenv

      - name: Install dependencies
        run: |
          # 先创建 Pipfile 如果不存在
          if [ ! -f "Pipfile" ]; then
            cat > Pipfile << EOF
[[source]]
url = "https://pypi.org/simple"
verify_ssl = true
name = "pypi"

[packages]
aiohttp = "*"
tqdm = "*"
opencc = "*"

[dev-packages]

[requires]
python_version = "3.13"
EOF
          fi
          pipenv install

      - name: Update EPG
        id: update
        run: |
          # 创建 output 目录
          mkdir -p output
          # 运行 epg 脚本
          pipenv run python -c "
import sys
sys.path.insert(0, '.')
try:
    import epg
    import asyncio
    asyncio.run(epg.main())
except Exception as e:
    print(f'Error: {e}')
    sys.exit(1)
"

      - name: Prepare files for commit
        run: |
          # 重命名最新生成的 epg_*.xml 为 epg.xml
          if ls output/epg_*.xml 1> /dev/null 2>&1; then
            latest_file=$(ls -t output/epg_*.xml | head -1)
            cp "$latest_file" output/epg.xml
            echo "Copied $latest_file to epg.xml"
          fi
          
          # 确保压缩文件存在
          if [ -f "output/epg.xml" ]; then
            # 如果 epg.gz 不存在，创建它
            if [ ! -f "output/epg.gz" ]; then
              gzip -c output/epg.xml > output/epg.gz
            else
              # 如果已存在，检查是否需要更新
              xml_mtime=$(stat -c %Y output/epg.xml)
              gz_mtime=$(stat -c %Y output/epg.gz)
              if [ $xml_mtime -gt $gz_mtime ]; then
                gzip -c output/epg.xml > output/epg.gz
              fi
            fi
          fi

      - name: Check for changes
        id: check_changes
        run: |
          # 检查 output 目录是否有变化
          git add output/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in output directory"
            # 显示具体变化
            git diff --staged --name-only
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 获取当前时间
          current_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          # 创建提交信息
          commit_message="chore: auto-update EPG data

          - Updated at $current_time
          - Generated by GitHub Actions"
          
          # 提交更改
          git commit -m "$commit_message"
          
          # 拉取最新更改并推送
          git pull --rebase origin master
          git push origin master
          
          echo "✅ Changes committed and pushed successfully"

      - name: Clean up old files
        if: always()
        run: |
          # 保留最近 5 个历史文件，删除旧的
          if ls output/epg_*.xml 1> /dev/null 2>&1; then
            echo "Cleaning up old EPG files..."
            # 按时间排序，保留最新的5个，删除其他的
            ls -t output/epg_*.xml | tail -n +6 | xargs -r rm -f
            
            echo "Remaining EPG files:"
            ls -lh output/epg_*.xml 2>/dev/null || echo "No historical EPG files"
          fi
          
          echo "Current output directory contents:"
          ls -lh output/ 2>/dev/null || echo "Output directory is empty"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: epg-files
          path: output/
          retention-days: 7
