Vname: Update EPG with pipenv

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install pipenv
        run: pip install pipenv
      
      - name: Install dependencies
        run: pipenv install
      
      - name: Run EPG update with pipenv
        run: pipenv run python merge.py
      
      - name: Check for output
        id: check_output
        run: |
          if [ -d "output" ] && (ls output/*.xml 2>/dev/null || ls output/*.gz 2>/dev/null); then
            echo "has_output=true" >> $GITHUB_OUTPUT
            echo "Output files:"
            find output/ -type f -name "*.xml" -o -name "*.gz"
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
            echo "No output files found"
          fi
      
      - name: Prepare files for commit
        if: steps.check_output.outputs.has_output == 'true'
        run: |
          # 重命名最新文件为固定名称
          if ls output/epg_*.xml 1> /dev/null 2>&1; then
            latest=$(ls -t output/epg_*.xml | head -1)
            cp "$latest" output/epg.xml
            echo "Copied $latest to epg.xml"
          fi
          
          # 创建压缩文件
          if [ -f "output/epg.xml" ] && [ ! -f "output/epg.gz" ]; then
            gzip -c output/epg.xml > output/epg.gz
          fi
      
      - name: Commit changes
        if: steps.check_output.outputs.has_output == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update EPG data [auto]"
          file_pattern: |
            output/epg.xml
            output/epg.gz
            output/epg_*.xml
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
      
      - name: Clean up old files
        if: always()
        run: |
          # 保留最近5个历史文件
          if ls output/epg_*.xml 1> /dev/null 2>&1; then
            count=$(ls output/epg_*.xml | wc -l)
            if [ $count -gt 5 ]; then
              echo "Cleaning up old files (keeping latest 5)"
              ls -t output/epg_*.xml | tail -n +6 | xargs rm -f
            fi
          fi
