name: Update EPG

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # 北京时间 0点、6点、12点、18点
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - master              # 当 master 分支有变动时触发

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install aiohttp tqdm opencc-python-reimplemented
      
      - name: Check for required files
        run: |
          echo "正在检查仓库文件..."
          ls -la
          if [ -f "merge.py" ]; then
            echo "✅ merge.py 已找到"
          else
            echo "❌ merge.py 未找到"
            exit 1
          fi
      
      - name: Run EPG update
        run: python merge.py
      
      - name: Check for output and Get Time
        id: check_output
        run: |
          # 检查 output 文件夹
          if [ -d "output" ] && (ls output/*.xml 2>/dev/null || ls output/*.gz 2>/dev/null); then
            echo "✅ EPG 输出文件已生成"
            echo "has_output=true" >> $GITHUB_OUTPUT
            # 获取北京时间并设为输出变量
            echo "now=$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
            ls -la output/
          else
            echo "❌ 未检测到输出文件"
            echo "has_output=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit changes
        if: steps.check_output.outputs.has_output == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # 使用上面步骤中生成的动态时间
          commit_message: "chore: 自动更新 EPG 数据 [${{ steps.check_output.outputs.now }}]"
          file_pattern: 'output/*'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
